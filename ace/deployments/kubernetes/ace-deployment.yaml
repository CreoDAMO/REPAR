apiVersion: v1
kind: Namespace
metadata:
  name: aequitas-ace
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ace-config
  namespace: aequitas-ace
data:
  ACE_PORT: "8080"
  BLOCKCHAIN_RPC: "http://aequitas-blockchain:26657"
  CHAIN_ID: "aequitas-1"
  NVIDIA_NIM_ENDPOINT: "http://ai-sidecar:8000"
  STORAGE_ENDPOINT: "http://ipfs:5001"
  NETWORK_MODE: "internet"
  GOVERNANCE_ENABLED: "true"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ace-kernel
  namespace: aequitas-ace
  labels:
    app: ace-kernel
    component: control-plane
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ace-kernel
  template:
    metadata:
      labels:
        app: ace-kernel
    spec:
      containers:
      - name: ace-kernel
        image: aequitas/ace-kernel:v1.0.0
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        envFrom:
        - configMapRef:
            name: ace-config
        - secretRef:
            name: ace-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ace-kernel
  namespace: aequitas-ace
  labels:
    app: ace-kernel
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: ace-kernel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sidecar
  namespace: aequitas-ace
  labels:
    app: ai-sidecar
    component: ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-sidecar
  template:
    metadata:
      labels:
        app: ai-sidecar
    spec:
      containers:
      - name: ai-sidecar
        image: aequitas/ai-sidecar:v1.0.0
        ports:
        - containerPort: 8000
          name: grpc
        env:
        - name: NVIDIA_API_KEY
          valueFrom:
            secretKeyRef:
              name: ace-secrets
              key: nvidia-api-key
        - name: MODEL_NAME
          value: "llama-3.1-70b"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
            nvidia.com/gpu: 1
          limits:
            memory: "8Gi"
            cpu: "4000m"
            nvidia.com/gpu: 1
---
apiVersion: v1
kind: Service
metadata:
  name: ai-sidecar
  namespace: aequitas-ace
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: grpc
  selector:
    app: ai-sidecar
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ace-ingress
  namespace: aequitas-ace
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - ace.aequitasprotocol.zone
    secretName: ace-tls
  rules:
  - host: ace.aequitasprotocol.zone
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ace-kernel
            port:
              number: 8080
---
apiVersion: v1
kind: Secret
metadata:
  name: ace-secrets
  namespace: aequitas-ace
type: Opaque
stringData:
  nvidia-api-key: "REPLACE_WITH_ACTUAL_KEY"
  blockchain-private-key: "REPLACE_WITH_ACTUAL_KEY"
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ace-metrics
  namespace: aequitas-ace
spec:
  selector:
    matchLabels:
      app: ace-kernel
  endpoints:
  - port: metrics
    interval: 30s
