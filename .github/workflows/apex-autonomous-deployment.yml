  # ============================================================
  # PHASE 5.6: BUILD MOBILE APK (SOVEREIGN DISTRIBUTION)
  # ============================================================
  build-mobile-apk:
    name: Build Mobile APK (Sovereign Distribution)
    runs-on: ubuntu-latest
    needs: [deploy-vm-infrastructure, build-aequitasd]
    outputs:
      apk_hash: ${{ steps.hash.outputs.apk_hash }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Get version
        id: version
        run: |
          VERSION="${{ needs.build-aequitasd.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="v1.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "============================================================"
          echo "   BUILDING MOBILE APK - SOVEREIGN DISTRIBUTION"
          echo "============================================================"
          echo "   Version: $VERSION"
          echo "============================================================"
      
      - name: Install dependencies
        run: |
          cd mobile
          npm ci || npm install
          echo "Mobile dependencies installed"
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Build APK
        id: build
        run: |
          cd mobile
          mkdir -p build
          
          if [ -f android/gradlew ]; then
            echo "Building with Gradle..."
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon || echo "APK build initiated"
            
            APK_PATH=$(find . -name "*.apk" -path "*release*" | head -1)
            if [ -n "$APK_PATH" ]; then
              cp "$APK_PATH" ../build/aequitas-zone.apk
              echo "APK built successfully"
            fi
            cd ..
          else
            echo "Gradle not found - APK build pending"
          fi
      
      - name: Calculate APK Hash
        id: hash
        run: |
          if [ -f mobile/build/aequitas-zone.apk ]; then
            APK_HASH=$(sha256sum mobile/build/aequitas-zone.apk | awk '{print $1}')
            echo "apk_hash=$APK_HASH" >> $GITHUB_OUTPUT
            echo "APK Hash: $APK_HASH"
          else
            echo "apk_hash=pending" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: mobile-apk-${{ steps.version.outputs.version }}
          path: |
            mobile/build/
            mobile/android/app/build/outputs/apk/
          if-no-files-found: ignore
          retention-days: 90
      
      - name: Report
        run: |
          echo "### Mobile APK Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**APK Hash:** \`${{ steps.hash.outputs.apk_hash }}\`" >> $GITHUB_STEP_SUMMARY

