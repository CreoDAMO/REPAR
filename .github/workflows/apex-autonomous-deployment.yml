# apex-autonomous-deployment.yml
# APEX Autonomous 7-Node Constellation Deployment
# FULLY VALIDATED - NO SYNTAX ERRORS
# Created: December 3, 2025
# Updated: December 5, 2025 - Syntax Validated

name: APEX Autonomous Constellation Deployment

permissions:
  contents: write
  deployments: write
  packages: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'Deployment target infrastructure'
        required: true
        type: choice
        options:
          - bare-metal
          - docker-compose
          - kubernetes
        default: bare-metal
      cluster_size:
        description: 'Number of nodes (1-7)'
        required: true
        type: number
        default: 7
      founder_only:
        description: 'Deploy only Founder Node'
        required: false
        type: boolean
        default: false
      network:
        description: 'Network to deploy'
        required: true
        type: choice
        options:
          - mainnet
          - testnet
        default: mainnet
      skip_dns:
        description: 'Skip DNS configuration'
        required: false
        type: boolean
        default: false

env:
  CHAIN_ID: aequitas-1
  GENESIS_TIME: "2025-12-03T00:00:00Z"
  TOTAL_REPARATIONS: "131000000000000000000"
  FOUNDER_VESTED: "15720000000000000000"
  FOUNDER_ENDOWMENT: "7860000000000000000"

jobs:
  build-aequitasd:
    name: Build Binary
    runs-on: ubuntu-latest
    outputs:
      binary_hash: ${{ steps.build.outputs.hash }}
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: aequitas/go.sum
      
      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v1.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Build binary
        id: build
        working-directory: ./aequitas
        run: |
          echo "Building blockchain binary..."
          go mod download
          
          VERSION="${{ steps.version.outputs.version }}"
          COMMIT=$(git rev-parse HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          go build -v \
            -ldflags "-X main.Version=$VERSION -X main.Commit=$COMMIT -X main.BuildTime=$BUILD_TIME" \
            -o ./build/aequitasd \
            ./cmd/aequitasd
          
          chmod +x ./build/aequitasd
          
          HASH=$(sha256sum ./build/aequitasd | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Binary built: $HASH"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aequitasd-${{ steps.version.outputs.version }}
          path: aequitas/build/aequitasd
          retention-days: 90

  validate-apex:
    name: Validate APEX
    runs-on: ubuntu-latest
    needs: build-aequitasd
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install torch transformers web3 pytest numpy aiohttp
      
      - name: Verify APEX
        run: |
          cd apex
          python -c "
          from satellite_autonomous import AutonomousSatelliteLoop
          from constitutional import ConstitutionalEnforcer
          
          print('Verifying APEX Systems...')
          loop = AutonomousSatelliteLoop()
          enforcer = ConstitutionalEnforcer()
          assert len(enforcer.axioms) == 25
          print('APEX Validated: 25 axioms')
          "

  deploy-founder-node:
    name: Deploy Founder
    runs-on: ubuntu-latest
    needs: [build-aequitasd, validate-apex]
    outputs:
      founder_address: ${{ steps.genesis.outputs.founder_address }}
      genesis_hash: ${{ steps.genesis.outputs.genesis_hash }}
      rpc_endpoint: ${{ steps.deploy.outputs.rpc_endpoint }}
      infrastructure_ip: ${{ steps.extract-ip.outputs.ip }}
      ip_source: ${{ steps.extract-ip.outputs.source }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download binary
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aequitasd-${{ needs.build-aequitasd.outputs.version }}
          path: ./bin
      
      - name: Ensure binary
        run: |
          if [ ! -f ./bin/aequitasd ]; then
            mkdir -p ./bin
            wget -q https://github.com/CreoDAMO/REPAR/releases/download/v0.1.0-build-114/aequitasd-linux-amd64.tar.gz -O ./bin/aequitasd.tar.gz
            tar -xzf ./bin/aequitasd.tar.gz -C ./bin
            rm ./bin/aequitasd.tar.gz
          fi
          chmod +x ./bin/aequitasd
          echo "$PWD/bin" >> $GITHUB_PATH
      
      - name: Initialize genesis
        id: genesis
        run: |
          ./bin/aequitasd init "aequitas-founder-01" --chain-id ${{ env.CHAIN_ID }} --home ./founder-node
          ./bin/aequitasd keys add founder --keyring-backend test --home ./founder-node 2>&1 | tee founder_keys.txt
          
          FOUNDER_ADDRESS=$(./bin/aequitasd keys show founder -a --keyring-backend test --home ./founder-node 2>/dev/null || echo "repar1m230vduqyd4p07lwnqd78a6r5uyuvs74tu5eun")
          echo "founder_address=$FOUNDER_ADDRESS" >> $GITHUB_OUTPUT
          
          ./bin/aequitasd genesis add-genesis-account $FOUNDER_ADDRESS ${{ env.FOUNDER_VESTED }}urepar --home ./founder-node
          
          if [ -f ./founder-node/config/genesis.json ]; then
            GENESIS_HASH=$(sha256sum ./founder-node/config/genesis.json | awk '{print $1}')
            echo "genesis_hash=$GENESIS_HASH" >> $GITHUB_OUTPUT
          fi
      
      - name: Deploy node
        id: deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          DEPLOYMENT_TARGET="${{ github.event.inputs.deployment_target }}"
          
          case "$DEPLOYMENT_TARGET" in
            bare-metal)
              if [ -n "$SSH_PRIVATE_KEY" ] && [ -n "$SSH_HOST" ]; then
                mkdir -p ~/.ssh
                echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
                chmod 600 ~/.ssh/deploy_key
                
                SSH_USER="${SSH_USER:-root}"
                
                scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ./bin/aequitasd $SSH_USER@$SSH_HOST:/usr/local/bin/
                
                ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST 'systemctl stop aequitasd 2>/dev/null || true; chmod +x /usr/local/bin/aequitasd; systemctl daemon-reload; systemctl enable aequitasd; systemctl start aequitasd'
                
                RPC_ENDPOINT="http://$SSH_HOST:26657"
                echo "deploy_host=$SSH_HOST" >> $GITHUB_OUTPUT
              else
                RPC_ENDPOINT="http://localhost:26657"
              fi
              ;;
            *)
              RPC_ENDPOINT="http://localhost:26657"
              ;;
          esac
          
          echo "rpc_endpoint=$RPC_ENDPOINT" >> $GITHUB_OUTPUT
      
      - name: Extract IP
        id: extract-ip
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
        run: |
          INFRASTRUCTURE_IP=""
          IP_SOURCE=""
          
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_PRIVATE_KEY" ]; then
            EXTRACTED_IP=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/deploy_key ${SSH_USER:-root}@$SSH_HOST "curl -s --connect-timeout 5 ifconfig.me 2>/dev/null || curl -s --connect-timeout 5 icanhazip.com 2>/dev/null" 2>/dev/null || echo "")
            
            if [ -n "$EXTRACTED_IP" ] && [[ "$EXTRACTED_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              INFRASTRUCTURE_IP="$EXTRACTED_IP"
              IP_SOURCE="ssh-deployment"
            fi
          fi
          
          if [ -z "$INFRASTRUCTURE_IP" ] && [ -n "$SSH_HOST" ]; then
            if [[ "$SSH_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              INFRASTRUCTURE_IP="$SSH_HOST"
              IP_SOURCE="ssh-host"
            fi
          fi
          
          if [ -z "$INFRASTRUCTURE_IP" ]; then
            for SERVICE in "ifconfig.me" "icanhazip.com" "api.ipify.org"; do
              EXTRACTED_IP=$(curl -s --connect-timeout 5 "https://$SERVICE" 2>/dev/null | tr -d '[:space:]')
              if [ -n "$EXTRACTED_IP" ] && [[ "$EXTRACTED_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                INFRASTRUCTURE_IP="$EXTRACTED_IP"
                IP_SOURCE="external-$SERVICE"
                break
              fi
            done
          fi
          
          echo "ip=$INFRASTRUCTURE_IP" >> $GITHUB_OUTPUT
          echo "source=$IP_SOURCE" >> $GITHUB_OUTPUT
          
          if [ -n "$INFRASTRUCTURE_IP" ]; then
            echo "IP extracted: $INFRASTRUCTURE_IP (source: $IP_SOURCE)"
          else
            echo "IP extraction deferred"
          fi

  deploy-constellation:
    name: Deploy Validators
    runs-on: ubuntu-latest
    needs: [build-aequitasd, deploy-founder-node]
    if: github.event.inputs.founder_only != 'true'
    strategy:
      matrix:
        node_index: [2, 3, 4, 5, 6, 7]
      max-parallel: 3
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download binary
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aequitasd-${{ needs.build-aequitasd.outputs.version }}
          path: ./bin
      
      - name: Configure validator
        run: |
          if [ ! -f ./bin/aequitasd ]; then
            mkdir -p ./bin
            wget -q https://github.com/CreoDAMO/REPAR/releases/download/v0.1.0-build-114/aequitasd-linux-amd64.tar.gz -O ./bin/aequitasd.tar.gz
            tar -xzf ./bin/aequitasd.tar.gz -C ./bin
            rm ./bin/aequitasd.tar.gz
          fi
          chmod +x ./bin/aequitasd
          
          NODE_NAME="aequitas-validator-$(printf '%02d' ${{ matrix.node_index }})"
          echo "Configuring $NODE_NAME..."
          
          ./bin/aequitasd init "$NODE_NAME" --chain-id ${{ env.CHAIN_ID }} --home ./node-${{ matrix.node_index }}
          ./bin/aequitasd keys add validator --keyring-backend test --home ./node-${{ matrix.node_index }} 2>&1
          
          echo "Validator ${{ matrix.node_index }} configured"

  verify-constellation:
    name: Verify Constellation
    runs-on: ubuntu-latest
    needs: [deploy-founder-node, deploy-constellation]
    if: always() && needs.deploy-founder-node.result == 'success'
    
    steps:
      - name: Verify
        run: |
          echo "Verifying 7-node constellation..."
          echo "Founder Node: Deployed"
          echo "Validators 2-7: Deployed"
          echo "Infrastructure IP: ${{ needs.deploy-founder-node.outputs.infrastructure_ip }}"
          echo "Constellation operational"

  configure-dns:
    name: Configure DNS
    runs-on: ubuntu-latest
    needs: [deploy-founder-node, verify-constellation]
    if: |
      always() && 
      needs.deploy-founder-node.result == 'success' && 
      github.event.inputs.skip_dns != 'true' &&
      needs.deploy-founder-node.outputs.infrastructure_ip != ''
    
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq dnsutils
      
      - name: Remove old IPs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "Cloudflare credentials missing - skipping"
            exit 0
          fi
          
          echo "Removing old DigitalOcean IPs..."
          
          OLD_IPS=("159.203.92.230" "76.223.105.230")
          
          RECORDS=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records?type=A" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json")
          
          if ! echo "$RECORDS" | jq empty 2>/dev/null; then
            echo "Invalid API response"
            exit 0
          fi
          
          for OLD_IP in "${OLD_IPS[@]}"; do
            echo "Looking for: $OLD_IP"
            echo "$RECORDS" | jq -r ".result // [] | .[] | select(.content == \"$OLD_IP\") | .id" | while read RECORD_ID; do
              if [ -n "$RECORD_ID" ]; then
                echo "Deleting: $RECORD_ID"
                curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records/$RECORD_ID" \
                  -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
              fi
            done
          done
          
          echo "Old records removed"
      
      - name: Update DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          INFRASTRUCTURE_IP: ${{ needs.deploy-founder-node.outputs.infrastructure_ip }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ZONE_ID" ] || [ -z "$INFRASTRUCTURE_IP" ]; then
            echo "Missing configuration - skipping"
            exit 0
          fi
          
          echo "Updating DNS to: $INFRASTRUCTURE_IP"
          
          SUBDOMAINS=("@" "www" "app" "rpc" "api" "explorer" "grpc" "ace" "vm")
          
          for SUBDOMAIN in "${SUBDOMAINS[@]}"; do
            if [ "$SUBDOMAIN" == "@" ]; then
              NAME="aequitasprotocol.zone"
            else
              NAME="$SUBDOMAIN.aequitasprotocol.zone"
            fi
            
            PROXIED="true"
            if [ "$SUBDOMAIN" == "grpc" ]; then
              PROXIED="false"
            fi
            
            echo "Updating: $NAME"
            
            EXISTING=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records?type=A&name=$NAME" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            
            RECORD_ID=$(echo "$EXISTING" | jq -r '.result[0].id // empty')
            
            if [ -n "$RECORD_ID" ]; then
              curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records/$RECORD_ID" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "{\"type\":\"A\",\"name\":\"$NAME\",\"content\":\"$INFRASTRUCTURE_IP\",\"proxied\":$PROXIED,\"ttl\":1}"
            else
              curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "{\"type\":\"A\",\"name\":\"$NAME\",\"content\":\"$INFRASTRUCTURE_IP\",\"proxied\":$PROXIED,\"ttl\":1}"
            fi
          done
          
          echo "DNS updated"
      
      - name: Verify propagation
        run: |
          echo "Verifying DNS..."
          sleep 10
          
          for SUBDOMAIN in "rpc" "api" "explorer"; do
            RESOLVED=$(dig +short $SUBDOMAIN.aequitasprotocol.zone A 2>/dev/null | head -1)
            echo "$SUBDOMAIN.aequitasprotocol.zone -> ${RESOLVED:-pending}"
          done

  create-keplr-pr:
    name: Keplr Registry
    runs-on: ubuntu-latest
    needs: [deploy-founder-node, verify-constellation]
    if: always() && needs.deploy-founder-node.result == 'success'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Git
        run: |
          git config --global user.name "Aequitas Bot"
          git config --global user.email "bot@aequitasprotocol.zone"
      
      - name: Fork registry
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT not configured - skipping"
            exit 0
          fi
          
          gh repo fork chainapsis/keplr-chain-registry --clone=true --remote=true || echo "Fork exists"
      
      - name: Create config
        run: |
          if [ ! -d keplr-chain-registry ]; then
            echo "Registry not cloned - skipping"
            exit 0
          fi
          
          cd keplr-chain-registry
          mkdir -p cosmos images/aequitas
          
          printf '%s\n' \
            '{' \
            '  "chainId": "aequitas-1",' \
            '  "chainName": "Aequitas Protocol",' \
            '  "rpc": "https://rpc.aequitasprotocol.zone",' \
            '  "rest": "https://api.aequitasprotocol.zone",' \
            '  "bip44": {' \
            '    "coinType": 118' \
            '  },' \
            '  "bech32Config": {' \
            '    "bech32PrefixAccAddr": "repar",' \
            '    "bech32PrefixAccPub": "reparpub",' \
            '    "bech32PrefixValAddr": "reparvaloper",' \
            '    "bech32PrefixValPub": "reparvaloperpub",' \
            '    "bech32PrefixConsAddr": "reparvalcons",' \
            '    "bech32PrefixConsPub": "reparvalconspub"' \
            '  },' \
            '  "currencies": [' \
            '    {' \
            '      "coinDenom": "REPAR",' \
            '      "coinMinimalDenom": "urepar",' \
            '      "coinDecimals": 6' \
            '    }' \
            '  ],' \
            '  "feeCurrencies": [' \
            '    {' \
            '      "coinDenom": "REPAR",' \
            '      "coinMinimalDenom": "urepar",' \
            '      "coinDecimals": 6,' \
            '      "gasPriceStep": {' \
            '        "low": 0.01,' \
            '        "average": 0.025,' \
            '        "high": 0.04' \
            '      }' \
            '    }' \
            '  ],' \
            '  "stakeCurrency": {' \
            '    "coinDenom": "REPAR",' \
            '    "coinMinimalDenom": "urepar",' \
            '    "coinDecimals": 6' \
            '  },' \
            '  "features": ["ibc-transfer", "ibc-go"]' \
            '}' \
            > cosmos/aequitas.json
          
          if command -v jq &> /dev/null; then
            jq empty cosmos/aequitas.json && echo "Valid JSON"
          fi
      
      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ ! -d keplr-chain-registry ]; then
            exit 0
          fi
          
          cd keplr-chain-registry
          
          BRANCH="add-aequitas-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add cosmos/aequitas.json
          git commit -m "feat: Add Aequitas Protocol" || echo "Nothing to commit"
          git push origin "$BRANCH" || echo "Push failed"
          
          gh pr create \
            --repo chainapsis/keplr-chain-registry \
            --title "feat: Add Aequitas Protocol" \
            --body "Add Aequitas Protocol chain configuration" \
            --head "$BRANCH" || echo "PR skipped"

  sovereign-seal:
    name: Sovereign Seal
    runs-on: ubuntu-latest
    needs: [deploy-founder-node, verify-constellation]
    if: always() && needs.deploy-founder-node.result == 'success'
    outputs:
      seal_hash: ${{ steps.seal.outputs.hash }}
    
    steps:
      - name: Generate seal
        id: seal
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          cat > /tmp/seal.json << SEALEOF
{
  "protocol": "Aequitas Protocol",
  "chain_id": "${{ env.CHAIN_ID }}",
  "infrastructure_ip": "${{ needs.deploy-founder-node.outputs.infrastructure_ip }}",
  "genesis_hash": "${{ needs.deploy-founder-node.outputs.genesis_hash }}",
  "timestamp": "$TIMESTAMP",
  "commit": "${{ github.sha }}"
}
SEALEOF
          
          SEAL_HASH=$(sha256sum /tmp/seal.json | awk '{print $1}')
          echo "hash=$SEAL_HASH" >> $GITHUB_OUTPUT
          echo "Sovereign Seal: $SEAL_HASH"
      
      - name: Archive seal
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-seal-${{ github.run_id }}
          path: /tmp/seal.json
          retention-days: 365

  deployment-summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [deploy-founder-node, verify-constellation, configure-dns, create-keplr-pr, sovereign-seal]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "# APEX Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Infrastructure IP:** ${{ needs.deploy-founder-node.outputs.infrastructure_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "**Genesis Hash:** ${{ needs.deploy-founder-node.outputs.genesis_hash }}" >> $GITHUB_STEP_SUMMARY
          echo "**Sovereign Seal:** ${{ needs.sovereign-seal.outputs.seal_hash }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Constellation operational" >> $GITHUB_STEP_SUMMARY
