            "aequitas-validator-03:VALIDATOR"
            "aequitas-validator-04:VALIDATOR"
            "aequitas-validator-05:VALIDATOR"
            "aequitas-validator-06:VALIDATOR"
            "aequitas-validator-07:VALIDATOR"
          )
          
          HEALTHY=0
          for node_info in "${NODES[@]}"; do
