# .github/workflows/wiki-publish.yml
# Automated Wiki Generation and Publishing
# Generates wiki pages from codebase and publishes to GitHub Wiki

name: Wiki Auto-Generation

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'aequitas/x/**'
      - 'frontend/src/pages/**'
      - 'mobile/**'
      - 'docs/**'
  schedule:
    # Run weekly on Sundays at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Allow manual triggers

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for statistics
      
      - name: Generate wiki pages
        run: |
          cd wiki
          chmod +x generate-wiki.sh
          ./generate-wiki.sh
      
      - name: Clone wiki repository
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki-repo
      
      - name: Copy generated pages to wiki repo
        run: |
          cp wiki/*.md wiki-repo/
          cd wiki-repo
          
          # Configure git
          git config user.name "Aequitas Wiki Bot"
          git config user.email "wiki-bot@aequitas.protocol"
          
          # Check if there are changes
          if git diff --quiet; then
            echo "No wiki changes detected"
            exit 0
          fi
          
          # Add and commit changes
          git add *.md
          git commit -m "Auto-update wiki: $(date '+%Y-%m-%d %H:%M:%S UTC')"
      
      - name: Push to wiki
        run: |
          cd wiki-repo
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload generated wiki as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiki-pages
          path: wiki/*.md
          retention-days: 30
      
      - name: Generate wiki statistics badge
        run: |
          WIKI_PAGES=$(ls -1 wiki/*.md | wc -l)
          echo "Total Wiki Pages: $WIKI_PAGES"
          
          # Create badge
          curl "https://img.shields.io/badge/Wiki%20Pages-${WIKI_PAGES}-blue" > wiki-badge.svg
      
      - name: Comment on commit with wiki update
        if: github.event_name == 'push'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const wikiFiles = fs.readdirSync('wiki').filter(f => f.endsWith('.md'));
            
            const body = `## 📚 Wiki Auto-Update Complete
            
            **Generated Pages**: ${wikiFiles.length}
            
            **Updated Files**:
            ${wikiFiles.map(f => `- ${f}`).join('\n')}
            
            **Wiki URL**: https://github.com/${{ github.repository }}/wiki
            
            _Auto-generated by Wiki Bot on ${new Date().toUTCString()}_
            `;
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });
