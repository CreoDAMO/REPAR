name: Aequitas Blockchain CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.3'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.61.0

      - name: Check formatting
        run: make fmt

      - name: Build binary
        run: make build

      - name: Run tests
        run: make test

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}-blockchain
          files: |
            aequitasd-linux-amd64.tar.gz
            genesis-mainnet.json
            genesis-testnet.json
          body: |
            ## Aequitas v${{ github.run_number }} - Sovereign Release
            
            - **Binary**: `aequitasd-linux-amd64.tar.gz` (SHA256: 3b3db469e1185d3be9cf63881e79500573a0a3e5983b715f6d66f4d8b027f0ce)
            - **Genesis**: 131T $REPAR allocated (chain_id: aequitas-1)
            - **Modules**: 13 governance (claims, justice, threatdefense)
            - **Flywheel**: Dual deflationary enforcement ready
            
            Validator auto-deploy enabled.
            
            Fund the nation: https://opencollective.com/aequitas-zone
            
            #AequitasZone #Coinomics #GenesisBlock

      - name: Deploy to DigitalOcean Validator
        if: github.ref == 'refs/heads/main'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}
        env:
          DO_REGION: nyc3
          DO_SIZE: s-2vcpu-4gb
          DO_IMAGE: ubuntu-22-04-x64
        run: |
          # Create droplet with user-data script
          DROPLET_NAME="aequitas-validator-${{ github.run_number }}"
          doctl compute droplet create $DROPLET_NAME \
            --region nyc3 \
            --image ubuntu-22-04-x64 \
            --size s-2vcpu-4gb \
            --user-data-file <(cat << 'EOF'
#!/bin/bash
set -e
apt update && apt install -y wget curl jq systemd
cd /tmp
# Download fresh binary from this release
wget https://github.com/CreoDAMO/REPAR/releases/download/v${{ github.run_number }}-blockchain/aequitasd-linux-amd64.tar.gz
tar -xzf aequitasd-linux-amd64.tar.gz
chmod +x aequitasd
sudo mv aequitasd /usr/local/bin/
# Init chain
aequitasd init "validator-${{ github.run_number }}" --chain-id aequitas-1 --home /root/.aequitas
# Fetch genesis
wget -O /root/.aequitas/config/genesis.json https://raw.githubusercontent.com/CreoDAMO/REPAR/main/chain-config/mainnet/genesis-mainnet.json
# Configure RPC/P2P
sed -i 's/laddr = "tcp:\/\/127.0.0.1:26657"/laddr = "tcp:\/\/0.0.0.0:26657"/' /root/.aequitas/config/config.toml
sed -i 's/external_address = ""/external_address = "$(curl -s ifconfig.me):26656"/' /root/.aequitas/config/config.toml
sed -i 's/minimum-gas-prices = ""/minimum-gas-prices = "0.001urepar"/' /root/.aequitas/config/app.toml
# Systemd service
sudo tee /etc/systemd/system/aequitas.service > /dev/null << 'SERVICE_EOF'
[Unit]
Description=Aequitas Validator #${{ github.run_number }}
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
User=root
WorkingDirectory=/root
ExecStart=/usr/local/bin/aequitasd start --home /root/.aequitas
Restart=always
RestartSec=5
LimitNOFILE=65535

[Install]
WantedBy=multi-user.target
SERVICE_EOF
sudo systemctl daemon-reload
sudo systemctl enable aequitas.service
sudo systemctl start aequitas.service
# Output IP
echo "Validator #${{ github.run_number }} deployed at $(curl -s ifconfig.me):26657" > /root/DEPLOYED.txt
EOF
          )
          
          # Wait for droplet to boot (30s)
          sleep 30
          
          # Get droplet IP
          DROPLET_IP=$(doctl compute droplet list --format "PublicIPv4" --no-header --tag-name "aequitas-$GITHUB_RUN_NUMBER" | head -1)
          
          # Test RPC
          if curl -s "http://$DROPLET_IP:26657/status" | jq .result.sync_info.latest_block_height | grep -q "1"; then
            echo "✅ Validator $GITHUB_RUN_NUMBER LIVE at http://$DROPLET_IP:26657/status"
          else
            echo "⚠️ Validator starting... check in 60s"
          fi
