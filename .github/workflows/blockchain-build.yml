name: Aequitas Blockchain CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.3'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0

      - name: Check formatting
        run: make fmt

      - name: Build binary
        run: make build

      - name: Run tests
        run: make test

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-blockchain
          name: Aequitas v${{ github.run_number }}
          files: |
            aequitasd-linux-amd64.gz
            genesis-mainnet.json
            genesis-testnet.json
          body: |
            ## Aequitas v${{ github.run_number }} - Sovereign Release

            - **Binary**: `aequitasd-linux-amd64.gz` (SHA256 verified)
            - **Genesis**: 131T $REPAR allocated
            - **Chain ID**: `aequitas-1`
            - **Validator Auto-Deploy**: Enabled

            Fund the nation: https://opencollective.com/aequitas-zone

            #AequitasZone #SovereignChain #GenesisBlock

      - name: Deploy to DigitalOcean
        if: github.ref == 'refs/heads/main'
        uses: digitalocean/app_action@main
        with:
          app_name: aequitas-validator-${{ github.run_number }}
          token: ${{ secrets.DO_TOKEN }}
        env:
          DO_REGION: nyc3
          DO_SIZE: s-2vcpu-4gb
          DO_IMAGE: ubuntu-22-04-x64
          USER_DATA: |
            #!/bin/bash
            set -e
            apt update && apt install -y wget curl jq
            cd /tmp
            wget https://github.com/CreoDAMO/REPAR/releases/download/v${{ github.run_number }}-blockchain/aequitasd-linux-amd64.gz
            gunzip aequitasd-linux-amd64.gz
            chmod +x aequitasd
            mv aequitasd /usr/local/bin/
            aequitasd init validator-${{ github.run_number }} --chain-id aequitas-1 --home /root/.aequitas
            wget -O /root/.aequitas/config/genesis.json https://raw.githubusercontent.com/CreoDAMO/REPAR/main/chain-config/mainnet/genesis-mainnet.json
            sed -i 's/laddr = "tcp:\/\/127.0.0.1:26657"/laddr = "tcp:\/\/0.0.0.0:26657"/' /root/.aequitas/config/config.toml
            sed -i 's/external_address = ""/external_address = "'$(curl -s ifconfig.me)':26656"'/' /root/.aequitas/config/config.toml
            cat > /etc/systemd/system/aequitas.service << 'EOF'
            [Unit]
            Description=Aequitas Validator #${{ github.run_number }}
            After=network-online.target

            [Service]
            User=root
            ExecStart=/usr/local/bin/aequitasd start --home /root/.aequitas
            Restart=always
            RestartSec=5
            LimitNOFILE=65535

            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable aequitas.service
            systemctl start aequitas.service
            echo "Validator #${{ github.run_number }} deployed!" > /root/DEPLOYED.txt
