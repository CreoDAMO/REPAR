name: Publish All Docker Images

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  VERSION: v1.0.0
  SHA: ${{ github.sha }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      # ---------------------------------------------------------
      # Blockchain Node (root Dockerfile)
      # ---------------------------------------------------------
      - name: Build Blockchain Node
        run: |
          docker build -t creodamo/repar:latest .
          docker tag creodamo/repar:latest creodamo/repar:${{ env.SHA }}
          docker tag creodamo/repar:latest creodamo/repar:${{ env.VERSION }}

      - name: Push Blockchain Node
        run: |
          docker push creodamo/repar:latest
          docker push creodamo/repar:${{ env.SHA }}
          docker push creodamo/repar:${{ env.VERSION }}

      # ---------------------------------------------------------
      # Backend API
      # ---------------------------------------------------------
      - name: Build Backend API
        run: |
          docker build -t creodamo/backend:latest ./backend
          docker tag creodamo/backend:latest creodamo/backend:${{ env.SHA }}
          docker tag creodamo/backend:latest creodamo/backend:${{ env.VERSION }}

      - name: Push Backend API
        run: |
          docker push creodamo/backend:latest
          docker push creodamo/backend:${{ env.SHA }}
          docker push creodamo/backend:${{ env.VERSION }}

      # ---------------------------------------------------------
      # Frontend
      # ---------------------------------------------------------
      - name: Build Frontend
        run: |
          docker build -t creodamo/frontend:latest ./frontend
          docker tag creodamo/frontend:latest creodamo/frontend:${{ env.SHA }}
          docker tag creodamo/frontend:latest creodamo/frontend:${{ env.VERSION }}

      - name: Push Frontend
        run: |
          docker push creodamo/frontend:latest
          docker push creodamo/frontend:${{ env.SHA }}
          docker push creodamo/frontend:${{ env.VERSION }}

      # ---------------------------------------------------------
      # Explorer
      # ---------------------------------------------------------
      - name: Build Explorer
        run: |
          docker build -t creodamo/explorer:latest ./dexplorer
          docker tag creodamo/explorer:latest creodamo/explorer:${{ env.SHA }}
          docker tag creodamo/explorer:latest creodamo/explorer:${{ env.VERSION }}

      - name: Push Explorer
        run: |
          docker push creodamo/explorer:latest
          docker push creodamo/explorer:${{ env.SHA }}
          docker push creodamo/explorer:${{ env.VERSION }}

      # ---------------------------------------------------------
      # Auditor
      # ---------------------------------------------------------
      - name: Build Auditor
        run: |
          docker build -t creodamo/auditor:latest ./auditor
          docker tag creodamo/auditor:latest creodamo/auditor:${{ env.SHA }}
          docker tag creodamo/auditor:latest creodamo/auditor:${{ env.VERSION }}

      - name: Push Auditor
        run: |
          docker push creodamo/auditor:latest
          docker push creodamo/auditor:${{ env.SHA }}
          docker push creodamo/auditor:${{ env.VERSION }}

      # ---------------------------------------------------------
      # Autonomous Agent
      # ---------------------------------------------------------
      - name: Build Autonomous Agent
        run: |
          docker build -f ai/autonomous/Dockerfile -t creodamo/autonomous-agent:latest .
          docker tag creodamo/autonomous-agent:latest creodamo/autonomous-agent:${{ env.SHA }}
          docker tag creodamo/autonomous-agent:latest creodamo/autonomous-agent:${{ env.VERSION }}

      - name: Push Autonomous Agent
        run: |
          docker push creodamo/autonomous-agent:latest
          docker push creodamo/autonomous-agent:${{ env.SHA }}
          docker push creodamo/autonomous-agent:${{ env.VERSION }}

      # ---------------------------------------------------------
      # ADNS Server
      # ---------------------------------------------------------
      - name: Build ADNS Server
        run: |
          docker build -f adns-server/Dockerfile -t creodamo/adns-server:latest .
          docker tag creodamo/adns-server:latest creodamo/adns-server:${{ env.SHA }}
          docker tag creodamo/adns-server:latest creodamo/adns-server:${{ env.VERSION }}

      - name: Push ADNS Server
        run: |
          docker push creodamo/adns-server:latest
          docker push creodamo/adns-server:${{ env.SHA }}
          docker push creodamo/adns-server:${{ env.VERSION }}

      # ---------------------------------------------------------
      # ACE Kernel
      # ---------------------------------------------------------
      - name: Build ACE Kernel
        run: |
          docker build -f ace/deployments/docker/Dockerfile -t creodamo/ace-kernel:latest ./ace
          docker tag creodamo/ace-kernel:latest creodamo/ace-kernel:${{ env.SHA }}
          docker tag creodamo/ace-kernel:latest creodamo/ace-kernel:${{ env.VERSION }}

      - name: Push ACE Kernel
        run: |
          docker push creodamo/ace-kernel:latest
          docker push creodamo/ace-kernel:${{ env.SHA }}
          docker push creodamo/ace-kernel:${{ env.VERSION }}

      # ---------------------------------------------------------
      # ACE Sidecar
      # ---------------------------------------------------------
      - name: Build ACE Sidecar
        run: |
          docker build -f ace/deployments/docker/Dockerfile.sidecar -t creodamo/ace-sidecar:latest ./ace
          docker tag creodamo/ace-sidecar:latest creodamo/ace-sidecar:${{ env.SHA }}
          docker tag creodamo/ace-sidecar:latest creodamo/ace-sidecar:${{ env.VERSION }}

      - name: Push ACE Sidecar
        run: |
          docker push creodamo/ace-sidecar:latest
          docker push creodamo/ace-sidecar:${{ env.SHA }}
          docker push creodamo/ace-sidecar:${{ env.VERSION }}

      # ---------------------------------------------------------
      # Sovereign VM
      # ---------------------------------------------------------
      - name: Build Sovereign VM
        run: |
          docker build -f vm/Dockerfile -t creodamo/vm:latest .
          docker tag creodamo/vm:latest creodamo/vm:${{ env.SHA }}
          docker tag creodamo/vm:latest creodamo/vm:${{ env.VERSION }}

      - name: Push Sovereign VM
        run: |
          docker push creodamo/vm:latest
          docker push creodamo/vm:${{ env.SHA }}
          docker push creodamo/vm:${{ env.VERSION }}
