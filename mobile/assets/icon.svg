<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient1)" stroke="#FFD700" stroke-width="3"/>
  
  <!-- Golden Gradient -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DB2777;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Scales of Justice Symbol -->
  <g transform="translate(100, 100)">
    <!-- Central Pillar -->
    <rect x="-4" y="-60" width="8" height="80" fill="url(#gradient2)" rx="4"/>
    
    <!-- Balance Beam -->
    <rect x="-50" y="-60" width="100" height="6" fill="url(#gradient2)" rx="3"/>
    
    <!-- Left Scale -->
    <path d="M -40 -54 L -50 -35 L -30 -35 Z" fill="#FFD700" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="-40" cy="-35" r="3" fill="#F59E0B"/>
    
    <!-- Right Scale -->
    <path d="M 40 -54 L 30 -35 L 50 -35 Z" fill="#FFD700" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="40" cy="-35" r="3" fill="#F59E0B"/>
    
    <!-- Base -->
    <ellipse cx="0" cy="25" rx="40" ry="6" fill="url(#gradient2)"/>
    
    <!-- $REPAR Text -->
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFD700" text-anchor="middle">$REPAR</text>
  </g>
  
  <!-- Ring of Justice -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
</svg>
