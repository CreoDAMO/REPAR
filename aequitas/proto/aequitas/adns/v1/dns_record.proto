syntax = "proto3";
package aequitas.adns.v1;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/CreoDAMO/REPAR/aequitas/x/adns/types";

// DNSRecord represents a blockchain-backed DNS entry with post-quantum security
message DNSRecord {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;

  string domain = 1;
  string record_type = 2;
  repeated string values = 3;
  uint32 ttl = 4;
  string owner = 5 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bool frozen = 6;
  bytes signature = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
  bytes fhe_encrypted_data = 10;
  string category = 11;
  bool genesis = 12;
}

// DomainNFT represents NFT-based domain ownership
message DomainNFT {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;

  string domain = 1;
  string owner = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string token_uri = 3;
  bool transferable = 4;
  uint64 mint_height = 5;
  uint64 token_id = 6;
}

// ConditionalDNS for smart contract-based DNS resolution
message ConditionalDNS {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;

  string domain = 1;
  string wasm_contract = 2;
  bytes contract_state = 3;
}

// AxiomValidation tracks constitutional axiom compliance
message AxiomValidation {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;

  uint32 axiom_number = 1;
  string axiom_name = 2;
  bool passed = 3;
  string reason = 4;
}

// FHEStatus tracks Fully Homomorphic Encryption status
message FHEStatus {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;

  string version = 1;
  bool active = 2;
  string algorithm = 3;
  uint64 encrypted_records = 4;
  uint64 decryption_count = 5;
}

// MLDSAStatus tracks post-quantum signature status
message MLDSAStatus {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;

  string mode = 1;
  bool active = 2;
  uint64 signatures_created = 3;
  uint64 signatures_verified = 4;
}
