syntax = "proto3";
package aequitas.agentkit.v1;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/CreoDAMO/REPAR/aequitas/x/agentkit/types";

// Agent represents an autonomous Justice Agent
message Agent {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;

  string id = 1;
  string creator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string wallet = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string objective = 4;
  repeated cosmos.base.v1beta1.Coin budget = 5 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  repeated string rules = 6;
  string status = 7;
  google.protobuf.Timestamp created_at = 8 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
  google.protobuf.Timestamp last_action = 9 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
  repeated MissionEntry mission_log = 10 [(gogoproto.nullable) = false];
}

// MissionEntry logs agent actions
message MissionEntry {
  option (gogoproto.equal) = true;
  option (gogoproto.goproto_getters) = false;

  google.protobuf.Timestamp timestamp = 1 [
    (gogoproto.nullable) = false,
    (gogoproto.stdtime) = true
  ];
  string tool = 2;
  string action = 3;
  string result = 4;
}

// Agent status constants
enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_ACTIVE = 1;
  AGENT_STATUS_PAUSED = 2;
  AGENT_STATUS_COMPLETED = 3;
}
