# BIRD Configuration for ADNS Anycast
# Announces sovereign root IP via BGP

log syslog all;
log "/var/log/bird.log" { debug, trace, info, remote, warning, error, auth, fatal, bug };

router id 135.232.208.145;

# Device protocol
protocol device {
    scan time 10;
}

# Direct protocol for connected routes
protocol direct {
    ipv4;
    interface "eth0", "lo";
}

# Kernel protocol - sync with OS routing table
protocol kernel {
    ipv4 {
        export all;
        import none;
    };
    scan time 20;
}

# Static routes for anycast announcements
protocol static sovereign_routes {
    ipv4;

    # Sovereign Root Anycast IP
    route 135.232.208.200/32 reject;

    # Sovereign DNS Anycast
    route 135.232.208.53/32 reject;
}

# BGP Template for peering
template bgp sovereign_peer {
    local as 65001;  # Aequitas ASN
    
    ipv4 {
        import none;
        export where proto = "sovereign_routes";
    };
    
    graceful restart on;
    long lived graceful restart on;
}

